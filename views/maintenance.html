<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站维护中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#ffdee9 0%,#b5fffc 100%);color:#fff;text-align:center;padding:20px}.container{max-width:520px;width:100%}.icon{font-size:72px;margin-bottom:24px;animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}h1{font-size:32px;font-weight:700;margin-bottom:16px}.msg{font-size:16px;line-height:1.8;opacity:0.9;margin-bottom:32px}.countdown{font-size:20px;font-weight:600;margin-bottom:32px}.time-num{display:inline-block;background:rgba(255,255,255,0.2);padding:8px 16px;border-radius:8px;min-width:48px;margin:0 4px;font-size:24px}.time-label{font-size:12px;display:block;opacity:0.8;margin-top:4px}.contact{font-size:14px;opacity:0.8;margin-top:24px}.contact a{color:#fff;text-decoration:underline}.bar{width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:32px;overflow:hidden}.bar .progress{height:100%;background:#fff;border-radius:2px;animation:prog 3s ease-in-out infinite}@keyframes prog{0%{width:0}50%{width:70%}100%{width:0}}</style>
</head><body><div class="container"><div class="icon" id="icon">🌸</div><h1 id="title">网站维护中</h1><p class="msg" id="message">我们正在进行系统升级，预计很快恢复。感谢耐心等待！</p><div class="countdown" id="countdown" style="display:none"></div><div class="contact" id="contact" style="display:none"></div><div class="bar"><div class="progress"></div></div></div>
<script>fetch('/api/maintenance/preview').then(r=>r.json()).then(d=>{if(d.title)document.getElementById('title').textContent=d.title;if(d.message)document.getElementById('message').textContent=d.message;if(d.icon)document.getElementById('icon').textContent=d.icon;if(d.bgColor)document.body.style.background=`linear-gradient(135deg,${d.bgColor} 0%,#b5fffc 100%)`;if(d.countdown){document.getElementById('countdown').style.display='block';const t=new Date(d.countdown);function u(){const diff=t-Date.now();if(diff<=0){document.getElementById('countdown').innerHTML='即将恢复...';return}const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);document.getElementById('countdown').innerHTML=(d>0?`<span class="time-num">${d}<span class="time-label">天</span></span>`:'')+`<span class="time-num">${String(h).padStart(2,'0')}<span class="time-label">时</span></span><span class="time-num">${String(m).padStart(2,'0')}<span class="time-label">分</span></span><span class="time-num">${String(s).padStart(2,'0')}<span class="time-label">秒</span></span>`}u();setInterval(u,1000)}if(d.contact){document.getElementById('contact').style.display='block';document.getElementById('contact').innerHTML='联系方式：'+d.contact}}).catch(()=>{});</script></body></html>
