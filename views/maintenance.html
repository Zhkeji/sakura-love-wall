<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站维护中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#ffdee9 0%,#b5fffc 100%);color:#fff;text-align:center;padding:20px;overflow:hidden}
.container{max-width:520px;width:100%;position:relative;z-index:2}

/* 齿轮动画 */
.gears{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.08}
.gear{position:absolute;border-radius:50%;border:8px dashed rgba(255,255,255,0.8)}
.gear::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30%;height:30%;background:rgba(255,255,255,0.6);border-radius:50%}
.gear-1{width:200px;height:200px;top:-40px;right:-40px;animation:spin 8s linear infinite}
.gear-2{width:150px;height:150px;bottom:-30px;left:-30px;animation:spin 6s linear infinite reverse}
.gear-3{width:100px;height:100px;top:50%;left:10%;animation:spin 10s linear infinite}
.gear-4{width:120px;height:120px;top:20%;right:5%;animation:spin 7s linear infinite reverse}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* 浮动粒子 */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.particle{position:absolute;background:rgba(255,255,255,0.15);border-radius:50%;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:0.6}100%{transform:translateY(-100vh) rotate(720deg);opacity:0}}

.icon{font-size:72px;margin-bottom:24px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:32px;font-weight:700;margin-bottom:16px}
.msg{font-size:16px;line-height:1.8;opacity:0.9;margin-bottom:32px}
.countdown{font-size:20px;font-weight:600;margin-bottom:32px}
.time-num{display:inline-block;background:rgba(255,255,255,0.2);padding:8px 16px;border-radius:8px;min-width:48px;margin:0 4px;font-size:24px}
.time-label{font-size:12px;display:block;opacity:0.8;margin-top:4px}
.contact{font-size:14px;opacity:0.8;margin-top:24px}
.contact a{color:#fff;text-decoration:underline}
.bar{width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:32px;overflow:hidden}
.bar .progress{height:100%;background:#fff;border-radius:2px;animation:prog 3s ease-in-out infinite}
@keyframes prog{0%{width:0}50%{width:70%}100%{width:0}}
</style>
</head><body>
<!-- 动态齿轮背景 -->
<div class="gears">
  <div class="gear gear-1"></div>
  <div class="gear gear-2"></div>
  <div class="gear gear-3"></div>
  <div class="gear gear-4"></div>
</div>
<!-- 浮动粒子 -->
<div class="particles" id="particles"></div>

<div class="container">
  <div class="icon" id="icon">🔧</div>
  <h1 id="title">网站维护中</h1>
  <p class="msg" id="message">我们正在进行系统升级，预计很快恢复。感谢耐心等待！</p>
  <div class="countdown" id="countdown" style="display:none"></div>
  <div class="contact" id="contact" style="display:none"></div>
  <div class="bar"><div class="progress"></div></div>
</div>

<script>
// 生成浮动粒子
(function(){
  var c=document.getElementById('particles');
  for(var i=0;i<15;i++){
    var s=document.createElement('span');
    s.className='particle';
    var size=8+Math.random()*20;
    s.style.cssText='width:'+size+'px;height:'+size+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-duration:'+(10+Math.random()*20)+'s;animation-delay:'+(Math.random()*5)+'s';
    c.appendChild(s);
  }
})();

// 加载维护设置
fetch('/api/maintenance/preview').then(function(r){return r.json()}).then(function(d){
  if(d.title)document.getElementById('title').textContent=d.title;
  if(d.message)document.getElementById('message').textContent=d.message;
  if(d.icon)document.getElementById('icon').textContent=d.icon;
  if(d.bgColor)document.body.style.background='linear-gradient(135deg,'+d.bgColor+' 0%,#b5fffc 100%)';
  if(d.countdown){
    document.getElementById('countdown').style.display='block';
    var t=new Date(d.countdown);
    function u(){
      var diff=t-Date.now();
      if(diff<=0){document.getElementById('countdown').innerHTML='即将恢复...';return}
      var days=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
      var html='';
      if(days>0)html+='<span class="time-num">'+days+'<span class="time-label">天</span></span>';
      html+='<span class="time-num">'+String(h).padStart(2,'0')+'<span class="time-label">时</span></span>';
      html+='<span class="time-num">'+String(m).padStart(2,'0')+'<span class="time-label">分</span></span>';
      html+='<span class="time-num">'+String(s).padStart(2,'0')+'<span class="time-label">秒</span></span>';
      document.getElementById('countdown').innerHTML=html;
    }
    u();setInterval(u,1000);
  }
  if(d.contact){document.getElementById('contact').style.display='block';document.getElementById('contact').innerHTML='联系方式：'+d.contact;}
}).catch(function(){});
</script>
</body></html>
