<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员后台 - 樱花表白墙</title>
<link rel="icon" href="/img/yingzhenyu.ico"><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(0deg,#ffdee9 0%,#b5fffc 100%);min-height:100vh;margin:0}.glass{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.6)}.sidebar{width:220px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.6);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}.nav-item{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#64748b;font-size:14px;transition:all 0.2s;cursor:pointer}.nav-item:hover{background:rgba(99,102,241,0.05);color:#6366f1}.nav-item.active{background:rgba(99,102,241,0.1);color:#6366f1;font-weight:600}.stat-card{background:rgba(255,255,255,0.9);border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.03);border:1px solid rgba(255,255,255,0.9)}.data-table{width:100%;border-collapse:collapse;font-size:14px}.data-table th,.data-table td{padding:10px 14px;text-align:left;border-bottom:1px solid #f1f5f9}.data-table th{background:rgba(255,255,255,0.5);font-weight:600;color:#64748b;font-size:12px;text-transform:uppercase}.data-table tr:hover{background:rgba(255,255,255,0.5)}.status-published{background:#dcfce7;color:#16a34a;padding:2px 8px;border-radius:10px;font-size:11px}.status-pending{background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:10px;font-size:11px}.status-hidden{background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:10px;font-size:11px}.btn-blue{background:linear-gradient(to right,#6366f1,#8b5cf6);color:white;border:none;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}.btn-outline{background:white;border:1px solid #e2e8f0;color:#64748b;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer}.btn-outline:hover{border-color:#6366f1;color:#6366f1}.btn-danger{background:white;border:1px solid #e2e8f0;color:#ef4444;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer}.page{display:none}.page.active{display:block}@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform 0.3s}.sidebar.open{transform:translateX(0)}}</style>
</head><body>
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-8 w-full max-w-sm shadow-2xl">
    <div class="text-center mb-6"><div class="text-5xl mb-2">🔧</div><h1 class="font-bold text-2xl text-indigo-600">管理员后台</h1><p class="text-sm text-gray-400">樱花表白墙</p></div>
    <div class="space-y-3"><input id="adminUser" type="text" class="w-full px-4 py-3 bg-white border border-indigo-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm" placeholder="管理员账号"><input id="adminPass" type="password" class="w-full px-4 py-3 bg-white border border-indigo-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm" placeholder="密码"><button onclick="adminLogin()" class="w-full btn-blue py-3">登录</button><p class="text-center text-xs text-gray-400">超级管理员请前往 <a href="/admin/super/" class="text-indigo-500 underline">超管后台</a></p></div>
  </div>
</div>
<div id="adminApp" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="p-4 border-b border-white/30"><span class="text-lg">🔧</span><span class="font-bold text-indigo-600 ml-2">管理员</span><p class="text-xs text-gray-400 mt-0.5" id="adminNameTag"></p></div>
    <nav class="flex-1 py-2">
      <div class="nav-item active" data-page="dashboard"><i class="fa-solid fa-chart-pie w-5"></i>仪表盘</div>
      <div class="nav-item" data-page="posts"><i class="fa-solid fa-heart w-5"></i>帖子管理</div>
      <div class="nav-item" data-page="comments"><i class="fa-solid fa-comments w-5"></i>评论管理</div>
      <div class="nav-item" data-page="reports"><i class="fa-solid fa-flag w-5"></i>举报处理</div>
    </nav>
    <div class="py-2 border-t border-white/30"><div class="nav-item" onclick="window.open('/')"><i class="fa-solid fa-external-link w-5"></i>访问前台</div><div class="nav-item" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket w-5"></i>退出登录</div></div>
  </aside>
  <main class="ml-[220px] min-h-screen">
    <header class="glass sticky top-0 z-50 px-6 py-3 flex justify-between items-center border-b border-white/30">
      <button onclick="document.getElementById('sidebar').classList.toggle('open')" class="md:hidden text-indigo-500"><i class="fa-solid fa-bars text-xl"></i></button>
      <div class="flex items-center gap-2"><span id="adminName" class="font-bold text-gray-700"></span><span class="bg-indigo-100 text-indigo-600 text-xs px-2 py-0.5 rounded-full">管理员</span></div>
    </header>
    <div class="p-6">
      <div class="page active" id="page-dashboard"><h2 class="text-xl font-bold text-gray-800 mb-6">📊 工作台</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsGrid"></div><div class="glass rounded-2xl p-5"><h3 class="font-bold text-gray-700 mb-3 text-sm">最新帖子</h3><div id="recentPosts"></div></div></div>
      <div class="page" id="page-posts"><div class="flex flex-wrap justify-between items-center mb-6 gap-3"><h2 class="text-xl font-bold text-gray-800">💕 帖子管理</h2><div class="flex gap-2"><select id="postFilter" onchange="loadPosts()" class="px-3 py-1.5 bg-white border border-indigo-100 rounded-lg text-sm"><option value="">全部</option><option value="published">已发布</option><option value="pending">待审核</option><option value="hidden">已隐藏</option></select><input id="postSearch" oninput="debounce(loadPosts,500)()" placeholder="搜索..." class="px-3 py-1.5 bg-white border border-indigo-100 rounded-lg text-sm w-36"></div></div><div class="glass rounded-2xl overflow-hidden"><div id="postsTable"></div></div><div class="flex justify-center gap-2 mt-4" id="postsPag"></div></div>
      <div class="page" id="page-comments"><h2 class="text-xl font-bold text-gray-800 mb-6">💬 评论管理</h2><div class="glass rounded-2xl overflow-hidden"><div id="commentsTable"></div></div><div class="flex justify-center gap-2 mt-4" id="commentsPag"></div></div>
      <div class="page" id="page-reports"><h2 class="text-xl font-bold text-gray-800 mb-6">🚩 举报处理</h2><div class="glass rounded-2xl overflow-hidden"><div id="reportsTable"></div></div></div>
    </div>
  </main>
</div>
<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] pointer-events-none"></div>
<script>
const API='';let token=localStorage.getItem('admin_token') || null;
document.querySelectorAll('.nav-item[data-page]').forEach(n=>{n.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));n.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+n.dataset.page).classList.add('active');loadPage(n.dataset.page);document.getElementById('sidebar').classList.remove('open');});});
async function checkAuth(){try{const d=await fetchAPI('/api/auth/me');if(!['admin','super_admin'].includes(d.user.role)){localStorage.removeItem('admin_token');token=null;return;}}}
function adminLogin(){const u=document.getElementById('adminUser').value,p=document.getElementById('adminPass').value;if(!u||!p)return;fetchAPI('/api/auth/login','POST',{username:u,password:p}).then(d=>{if(!['admin','super_admin'].includes(d.user.role))return showT('没有管理权限','error');if(d.user.role==='super_admin'){showT('超级管理员请前往超管后台','error');return;}token=d.token=d.token; localStorage.setItem('admin_token',token); adminUser=d.user; showT('登录成功');}).catch(e=>showT(e.message,'error'));}
function showDashboard(){document.getElementById('loginPage').style.display='none';document.getElementById('adminApp').style.display='block';document.getElementById('adminName').textContent=adminUser.nickname;document.getElementById('adminNameTag').textContent=adminUser.nickname;loadPage('dashboard');}
function adminLogout(){token=null;adminUser=null;localStorage.removeItem('admin_token');location.reload();}
function loadPage(p){const fn={dashboard:loadDashboard,posts:loadPosts,comments:loadComments,reports:loadReports};if(fn[p])fn[p]();}
async function loadDashboard(){try{const d=await fetchAPI('/api/admin/stats');const s=d.stats;document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="text-xl mb-1">💕</div><div class="text-xl font-bold">${s.totalPosts}</div><div class="text-xs text-gray-400">总帖子</div></div><div class="stat-card"><div class="text-xl mb-1">💬</div><div class="text-xl font-bold">${s.totalComments}</div><div class="text-xs text-gray-400">总评论</div></div><div class="stat-card"><div class="text-xl mb-1">📝</div><div class="text-xl font-bold">${s.todayPosts}</div><div class="text-xs text-gray-400">今日</div></div><div class="stat-card"><div class="text-xl mb-1">⚠️</div><div class="text-xl font-bold">${s.pendingReview}</div><div class="text-xs text-gray-400">待审</div></div>`;document.getElementById('recentPosts').innerHTML=d.recentPosts.length?`<table class="data-table"><thead><tr><th>标题</th><th>作者</th><th>状态</th><th>时间</th></tr></thead><tbody>${d.recentPosts.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.nickname)}</td><td><span class="status-${p.status}">${stText(p.status)}</span></td><td>${fmtDate(p.created_at)}</td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-6">暂无</p>';}catch(e){showT('加载失败','error');}}
let pp=1;async function loadPosts(page=1){pp=page;const st=document.getElementById('postFilter').value,sk=document.getElementById('postSearch').value;let url=`/api/admin/posts?page=${page}&limit=15`;if(st)url+=`&status=${st}`;if(sk)url+=`&search=${encodeURIComponent(sk)}`;try{const d=await fetchAPI(url);document.getElementById('postsTable').innerHTML=`<table class="data-table"><thead><tr><th>标题</th><th>作者</th><th>状态</th><th>👍</th><th>💬</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.posts.map(p=>`<tr><td class="max-w-[180px] truncate">${esc(p.title)}</td><td>${esc(p.author_name||'')}</td><td><span class="status-${p.status}">${stText(p.status)}</span></td><td>${p.likes}</td><td>${p.comments_count}</td><td>${fmtDate(p.created_at)}</td><td class="flex gap-1">${p.status==='pending'?`<button class="btn-outline" onclick="updatePost('${p.id}','published')">通过</button>`:''}${p.status==='published'?`<button class="btn-outline" onclick="updatePost('${p.id}','hidden')">隐藏</button>`:''}${p.status==='hidden'?`<button class="btn-outline" onclick="updatePost('${p.id}','published')">显示</button>`:''}<button class="btn-danger" onclick="deletePost('${p.id}')">删除</button></td></tr>`).join('')}</tbody></table>`;renderPag('postsPag',d.pagination,loadPosts);}catch(e){}}
async function updatePost(id,st){try{await fetchAPI(`/api/admin/posts/${id}/status`,'PUT',{status:st});showT('已更新');loadPosts(pp);}catch(e){showT(e.message,'error');}}
async function deletePost(id){if(!confirm('确定删除？'))return;try{await fetchAPI(`/api/admin/posts/${id}`,'DELETE');showT('已删除');loadPosts(pp);}catch(e){showT(e.message,'error');}}
let cp=1;async function loadComments(page=1){cp=page;try{const d=await fetchAPI(`/api/admin/comments?page=${page}&limit=20`);document.getElementById('commentsTable').innerHTML=d.comments.length?`<table class="data-table"><thead><tr><th>内容</th><th>作者</th><th>帖子</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.comments.map(c=>`<tr><td class="max-w-[250px] truncate">${esc(c.content)}</td><td>${esc(c.author_name)}</td><td>${esc(c.post_title||'')}</td><td>${fmtDate(c.created_at)}</td><td><button class="btn-danger" onclick="deleteComment('${c.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-6">暂无</p>';renderPag('commentsPag',d.pagination,loadComments);}catch(e){}}
async function deleteComment(id){if(!confirm('确定？'))return;try{await fetchAPI(`/api/admin/comments/${id}`,'DELETE');showT('已删除');loadComments(cp);}catch(e){showT(e.message,'error');}}
async function loadReports(){try{const d=await fetchAPI('/api/admin/reports');document.getElementById('reportsTable').innerHTML=d.reports.length?`<table class="data-table"><thead><tr><th>举报人</th><th>类型</th><th>原因</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.reports.map(r=>`<tr><td>${esc(r.reporter_name)}</td><td>${r.target_type}</td><td>${esc(r.reason)}</td><td>${fmtDate(r.created_at)}</td><td class="flex gap-1"><button class="btn-outline" onclick="resolve('${r.id}','resolved')">处理</button><button class="btn-outline" onclick="resolve('${r.id}','dismissed')">驳回</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-6">暂无</p>';}catch(e){}}
async function resolve(id,st){try{await fetchAPI(`/api/admin/reports/${id}`,'PUT',{status:st});showT('已处理');loadReports();}catch(e){showT(e.message,'error');}}
async function fetchAPI(url,method='GET',body){const h={'Content-Type':'application/json'};if(token)h['Authorization']=`Bearer ${token}`;const o={method,headers:h};if(body)o.body=JSON.stringify(body);const r=await fetch(API+url,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'失败');return d;}
function renderPag(id,pag,fn){const c=document.getElementById(id);if(!pag||pag.totalPages<=1){c.innerHTML='';return;}let h='';if(pag.page>1)h+=`<button class="btn-outline" onclick="${fn.name}(${pag.page-1})">上页</button>`;for(let i=Math.max(1,pag.page-2);i<=Math.min(pag.totalPages,pag.page+2);i++)h+=`<button class="${i===pag.page?'btn-blue':'btn-outline'}" onclick="${fn.name}(${i})">${i}</button>`;if(pag.page<pag.totalPages)h+=`<button class="btn-outline" onclick="${fn.name}(${pag.page+1})">下页</button>`;c.innerHTML=h;}
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(s){if(!s)return '-';return new Date(s+(s.includes('Z')?'':'Z')).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function stText(s){return{published:'已发布',pending:'待审核',hidden:'已隐藏'}[s]||s;}
function showT(m,t='success'){const c=document.getElementById('toast'),d=document.createElement('div');d.style.cssText=`background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);padding:10px 20px;border-radius:50px;box-shadow:0 5px 20px rgba(0,0,0,0.08);font-size:0.85rem;margin-bottom:8px;display:flex;align-items:center;animation:toastIn 0.3s;border:1px solid #e0e7ff;color:#333`;const icon=t==='success'?'<i class="fa-solid fa-circle-check" style="color:#10b981;margin-right:8px"></i>':'<i class="fa-solid fa-circle-exclamation" style="color:#ef4444;margin-right:8px"></i>';d.innerHTML=icon+'<span>'+m+'</span>';c.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300);},3000);}
function debounce(fn,d){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),d);};}
if(token)checkAuth();
</script></body></html>
