<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级管理员 - 樱花表白墙</title>
<link rel="icon" href="/img/yingzhenyu.ico"><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#ffdee9 0%,#c4b5fd 50%,#b5fffc 100%);min-height:100vh;margin:0}.glass{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.6)}.sidebar{width:240px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.6);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:#64748b;font-size:14px;transition:all 0.2s;cursor:pointer}.nav-item:hover{background:rgba(236,72,153,0.05);color:#db2777}.nav-item.active{background:rgba(236,72,153,0.1);color:#db2777;font-weight:600}.stat-card{background:rgba(255,255,255,0.9);border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.03);border:1px solid rgba(255,255,255,0.9)}.data-table{width:100%;border-collapse:collapse;font-size:14px}.data-table th,.data-table td{padding:12px 16px;text-align:left;border-bottom:1px solid #f1f5f9}.data-table th{background:rgba(255,255,255,0.5);font-weight:600;color:#64748b;font-size:13px}.data-table tr:hover{background:rgba(255,255,255,0.5)}.status-published{background:#dcfce7;color:#16a34a;padding:2px 10px;border-radius:12px;font-size:12px}.status-pending{background:#fef3c7;color:#d97706;padding:2px 10px;border-radius:12px;font-size:12px}.status-hidden{background:#f1f5f9;color:#64748b;padding:2px 10px;border-radius:12px;font-size:12px}.btn-pink{background:linear-gradient(to right,#ec4899,#f43f5e);color:white;border:none;padding:8px 20px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 6px rgba(236,72,153,0.25)}.btn-pink:active{transform:scale(0.95)}.btn-outline{background:white;border:1px solid #e2e8f0;color:#64748b;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer}.btn-outline:hover{border-color:#ec4899;color:#ec4899}.btn-danger{background:white;border:1px solid #e2e8f0;color:#ef4444;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer}.switch{position:relative;width:52px;height:28px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ddd;border-radius:28px;transition:0.3s}.slider:before{content:'';position:absolute;height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.3s}.switch input:checked+.slider{background:#ec4899}.switch input:checked+.slider:before{transform:translateX(24px)}.page{display:none}.page.active{display:block}@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform 0.3s}.sidebar.open{transform:translateX(0)}}</style>
</head><body>
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-8 w-full max-w-sm shadow-2xl">
    <div class="text-center mb-6"><div class="text-5xl mb-2">👑</div><h1 class="font-bold text-2xl text-pink-600">超级管理员</h1><p class="text-sm text-gray-400">樱花表白墙</p></div>
    <div class="space-y-3"><input id="adminUser" type="text" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm" placeholder="超管账号"><input id="adminPass" type="password" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm" placeholder="密码"><button onclick="adminLogin()" class="w-full btn-pink py-3">登录</button><p class="text-center text-xs text-gray-400">普通管理员请前往 <a href="/admin/admin/" class="text-pink-500 underline">管理员后台</a></p></div>
  </div>
</div>
<div id="adminApp" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b border-white/30"><span class="text-xl">👑</span><span class="font-bold text-pink-600 ml-2">超管后台</span></div>
    <nav class="flex-1 py-2">
      <div class="nav-item active" data-page="dashboard"><i class="fa-solid fa-chart-pie w-5"></i>仪表盘</div>
      <div class="nav-item" data-page="posts"><i class="fa-solid fa-heart w-5"></i>帖子管理</div>
      <div class="nav-item" data-page="users"><i class="fa-solid fa-users w-5"></i>用户管理</div>
      <div class="nav-item" data-page="comments"><i class="fa-solid fa-comments w-5"></i>评论管理</div>
      <div class="nav-item" data-page="reports"><i class="fa-solid fa-flag w-5"></i>举报处理</div>
      <div class="border-t border-white/30 my-2"></div>
      <div class="px-5 py-1 text-xs text-gray-400 uppercase tracking-wider">系统管理</div>
      <div class="nav-item" data-page="settings"><i class="fa-solid fa-gear w-5"></i>网站设置</div>
      <div class="nav-item" data-page="maintenance"><i class="fa-solid fa-wrench w-5"></i>维护系统</div>
      <div class="nav-item" data-page="admins"><i class="fa-solid fa-user-shield w-5"></i>管理员管理</div>
      <div class="nav-item" data-page="announcements"><i class="fa-solid fa-bullhorn w-5"></i>公告管理</div>
    </nav>
    <div class="py-2 border-t border-white/30"><div class="nav-item" onclick="window.open('/')"><i class="fa-solid fa-external-link w-5"></i>访问前台</div><div class="nav-item" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket w-5"></i>退出登录</div></div>
  </aside>
  <main class="ml-60 min-h-screen">
    <header class="glass sticky top-0 z-50 px-6 py-3 flex justify-between items-center border-b border-white/30">
      <button onclick="document.getElementById('sidebar').classList.toggle('open')" class="md:hidden text-pink-500"><i class="fa-solid fa-bars text-xl"></i></button>
      <div class="flex items-center gap-2"><span id="adminName" class="font-bold text-gray-700"></span><span class="bg-pink-100 text-pink-600 text-xs px-2 py-0.5 rounded-full">👑 超级管理员</span></div>
    </header>
    <div class="p-6">
      <div class="page active" id="page-dashboard"><h2 class="text-2xl font-bold text-gray-800 mb-6">📊 仪表盘</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsGrid"></div><div class="glass rounded-2xl p-6"><h3 class="font-bold text-gray-700 mb-4">最新帖子</h3><div id="recentPosts"></div></div></div>
      <div class="page" id="page-posts"><div class="flex flex-wrap justify-between items-center mb-6 gap-4"><h2 class="text-2xl font-bold text-gray-800">💕 帖子管理</h2><div class="flex gap-2"><select id="postFilter" onchange="loadPosts()" class="px-3 py-2 bg-white border border-pink-100 rounded-xl text-sm"><option value="">全部</option><option value="published">已发布</option><option value="pending">待审核</option><option value="hidden">已隐藏</option></select><input id="postSearch" oninput="debounce(loadPosts,500)()" placeholder="搜索..." class="px-3 py-2 bg-white border border-pink-100 rounded-xl text-sm w-40"></div></div><div class="glass rounded-2xl overflow-hidden"><div id="postsTable"></div></div><div class="flex justify-center gap-2 mt-4" id="postsPag"></div></div>
      <div class="page" id="page-users"><div class="flex flex-wrap justify-between items-center mb-6 gap-4"><h2 class="text-2xl font-bold text-gray-800">👥 用户管理</h2><div class="flex gap-2"><select id="userFilter" onchange="loadUsers()" class="px-3 py-2 bg-white border border-pink-100 rounded-xl text-sm"><option value="">全部</option><option value="user">用户</option><option value="admin">管理员</option></select><input id="userSearch" oninput="debounce(loadUsers,500)()" placeholder="搜索..." class="px-3 py-2 bg-white border border-pink-100 rounded-xl text-sm w-40"></div></div><div class="glass rounded-2xl overflow-hidden"><div id="usersTable"></div></div><div class="flex justify-center gap-2 mt-4" id="usersPag"></div></div>
      <div class="page" id="page-comments"><h2 class="text-2xl font-bold text-gray-800 mb-6">💬 评论管理</h2><div class="glass rounded-2xl overflow-hidden"><div id="commentsTable"></div></div><div class="flex justify-center gap-2 mt-4" id="commentsPag"></div></div>
      <div class="page" id="page-reports"><h2 class="text-2xl font-bold text-gray-800 mb-6">🚩 举报处理</h2><div class="glass rounded-2xl overflow-hidden"><div id="reportsTable"></div></div></div>
      <div class="page" id="page-settings"><h2 class="text-2xl font-bold text-gray-800 mb-6">⚙️ 网站设置</h2><div class="glass rounded-2xl p-6 max-w-lg"><div class="space-y-4"><div><label class="text-sm text-gray-500">网站名称</label><input id="setSiteName" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm"></div><div><label class="text-sm text-gray-500">网站描述</label><input id="setSiteDesc" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm"></div><label class="flex items-center gap-2"><input type="checkbox" id="setAllowReg" class="accent-pink-500"><span class="text-sm">允许注册</span></label><label class="flex items-center gap-2"><input type="checkbox" id="setAllowAnonymous" class="accent-pink-500"><span class="text-sm">允许匿名</span></label><label class="flex items-center gap-2"><input type="checkbox" id="setPostReview" class="accent-pink-500"><span class="text-sm">帖子需审核</span></label><div><label class="text-sm text-gray-500">每帖最多图片</label><input id="setMaxImg" type="number" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm" min="1" max="20"></div><button onclick="saveSettings()" class="btn-pink w-full">保存设置</button></div></div></div>
      <div class="page" id="page-maintenance"><h2 class="text-2xl font-bold text-gray-800 mb-6">🔧 维护系统</h2><div class="glass rounded-2xl p-6 mb-6 flex items-center justify-between"><div><h3 class="font-bold text-gray-700">维护模式</h3><p class="text-sm text-gray-400">开启后前台显示维护页面</p></div><label class="switch"><input type="checkbox" id="maintToggle" onchange="toggleMaint()"><span class="slider"></span></label></div><div class="glass rounded-2xl p-6 max-w-lg"><div class="space-y-4"><div><label class="text-sm text-gray-500">图标</label><input id="maintIcon" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm" placeholder="🌸"></div><div><label class="text-sm text-gray-500">标题</label><input id="maintTitle" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm"></div><div><label class="text-sm text-gray-500">说明</label><textarea id="maintMsg" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm min-h-[80px] resize-none"></textarea></div><div><label class="text-sm text-gray-500">背景色</label><input id="maintBg" type="color" class="w-full mt-1 h-10 rounded-xl cursor-pointer" value="#ffdee9"></div><div><label class="text-sm text-gray-500">预计恢复时间</label><input id="maintCountdown" type="datetime-local" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm"></div><div><label class="text-sm text-gray-500">联系方式</label><input id="maintContact" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm"></div><div><label class="text-sm text-gray-500">自定义CSS</label><textarea id="maintCss" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm font-mono min-h-[60px] resize-none"></textarea></div><div><label class="text-sm text-gray-500">自定义HTML</label><textarea id="maintHtml" class="w-full mt-1 px-3 py-2 border border-pink-100 rounded-xl text-sm font-mono min-h-[60px] resize-none"></textarea></div><button onclick="saveMaint()" class="btn-pink w-full">保存维护设置</button></div></div></div>
      <div class="page" id="page-admins"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">🛡️ 管理员管理</h2><button onclick="showAddAdmin()" class="btn-pink"><i class="fa-solid fa-plus mr-1"></i>添加管理员</button></div><div class="glass rounded-2xl overflow-hidden"><div id="adminsTable"></div></div></div>
      <div class="page" id="page-announcements"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">📢 公告管理</h2><button onclick="showAddAnn()" class="btn-pink"><i class="fa-solid fa-plus mr-1"></i>发布公告</button></div><div class="glass rounded-2xl overflow-hidden"><div id="annTable"></div></div></div>
    </div>
  </main>
</div>
<div id="addAdminModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display:none" onclick="this.style.display='none'">
  <div class="glass rounded-3xl p-6 w-full max-w-sm" onclick="event.stopPropagation()"><h3 class="font-bold text-xl text-gray-800 mb-4">添加管理员</h3><div class="space-y-3"><input id="newAdminUser" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl text-sm" placeholder="用户名"><input id="newAdminPass" type="password" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl text-sm" placeholder="密码"><input id="newAdminNick" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl text-sm" placeholder="昵称"><button onclick="addAdmin()" class="btn-pink w-full">创建</button></div></div>
</div>
<div id="addAnnModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display:none" onclick="this.style.display='none'">
  <div class="glass rounded-3xl p-6 w-full max-w-lg" onclick="event.stopPropagation()"><h3 class="font-bold text-xl text-gray-800 mb-4">发布公告</h3><div class="space-y-3"><input id="annTitle" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl text-sm" placeholder="公告标题"><textarea id="annContent" class="w-full px-4 py-3 bg-white border border-pink-100 rounded-xl text-sm min-h-[100px] resize-none" placeholder="公告内容"></textarea><div class="flex gap-3"><select id="annType" class="px-3 py-2 bg-white border border-pink-100 rounded-xl text-sm"><option value="info">📢 普通</option><option value="urgent">🚨 紧急</option><option value="update">✨ 更新</option></select><label class="flex items-center gap-2"><input type="checkbox" id="annPin" class="accent-pink-500"><span class="text-sm">置顶</span></label></div><button onclick="addAnn()" class="btn-pink w-full">发布公告</button></div></div>
</div> class="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] pointer-events-none"></div>
<script>
const API='';let token=localStorage.getItem('admin_token') || null;
document.querySelectorAll('.nav-item[data-page]').forEach(n=>{n.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));n.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+n.dataset.page).classList.add('active');loadPage(n.dataset.page);document.getElementById('sidebar').classList.remove('open');});});
async function checkAuth(){try{const d=await fetchAPI('/api/auth/me');if(d.user.role!=='super_admin'){localStorage.removeItem('admin_token');token=***
function adminLogin(){const u=document.getElementById('adminUser').value,p=document.getElementById('adminPass').value;if(!u||!p)return;fetchAPI('/api/auth/login','POST',{username:u,password:p}).then(d=>{if(d.user.role!=='super_admin')return showT('仅限超级管理员','error');token=d.token=d.token; localStorage.setItem('admin_token',token); adminUser=d.user; showT('登录成功 👑');}).catch(e=>showT(e.message,'error'));}
function showDashboard(){document.getElementById('loginPage').style.display='none';document.getElementById('adminApp').style.display='block';document.getElementById('adminName').textContent=adminUser.nickname;loadPage('dashboard');}
function adminLogout(){token=null;adminUser=null;localStorage.removeItem('admin_token');location.reload();}
function loadPage(p){const fn={dashboard:loadDashboard,posts:loadPosts,users:loadUsers,comments:loadComments,reports:loadReports,settings:loadSettings,maintenance:loadMaint,admins:loadAdmins,announcements:loadAnnouncements};if(fn[p])fn[p]();}
async function loadDashboard(){try{const d=await fetchAPI('/api/admin/stats');const s=d.stats;document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="text-2xl mb-1">👥</div><div class="text-2xl font-bold">${s.totalUsers}</div><div class="text-xs text-gray-400">总用户</div></div><div class="stat-card"><div class="text-2xl mb-1">💕</div><div class="text-2xl font-bold">${s.totalPosts}</div><div class="text-xs text-gray-400">总帖子</div></div><div class="stat-card"><div class="text-2xl mb-1">💬</div><div class="text-2xl font-bold">${s.totalComments}</div><div class="text-xs text-gray-400">总评论</div></div><div class="stat-card"><div class="text-2xl mb-1">⚠️</div><div class="text-2xl font-bold">${s.pendingReview}</div><div class="text-xs text-gray-400">待审核</div></div>`;document.getElementById('recentPosts').innerHTML=d.recentPosts.length?`<table class="data-table"><thead><tr><th>标题</th><th>作者</th><th>状态</th><th>时间</th></tr></thead><tbody>${d.recentPosts.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.nickname)}</td><td><span class="status-${p.status}">${stText(p.status)}</span></td><td>${fmtDate(p.created_at)}</td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-8">暂无数据</p>';}catch(e){showT('加载失败','error');}}
let pp=1;async function loadPosts(page=1){pp=page;const st=document.getElementById('postFilter').value,sk=document.getElementById('postSearch').value;let url=`/api/admin/posts?page=${page}&limit=15`;if(st)url+=`&status=${st}`;if(sk)url+=`&search=${encodeURIComponent(sk)}`;try{const d=await fetchAPI(url);document.getElementById('postsTable').innerHTML=`<table class="data-table"><thead><tr><th>标题</th><th>作者</th><th>状态</th><th>👍</th><th>💬</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.posts.map(p=>`<tr><td class="max-w-[200px] truncate">${esc(p.title)}</td><td>${esc(p.author_name||'')}</td><td><span class="status-${p.status}">${stText(p.status)}</span></td><td>${p.likes}</td><td>${p.comments_count}</td><td>${fmtDate(p.created_at)}</td><td class="flex gap-1">${p.status==='pending'?`<button class="btn-outline" onclick="updatePost('${p.id}','published')">通过</button>`:''}${p.status==='published'?`<button class="btn-outline" onclick="updatePost('${p.id}','hidden')">隐藏</button>`:''}${p.status==='hidden'?`<button class="btn-outline" onclick="updatePost('${p.id}','published')">显示</button>`:''}<button class="btn-danger" onclick="deletePost('${p.id}')">删除</button></td></tr>`).join('')}</tbody></table>`;renderPag('postsPag',d.pagination,loadPosts);}catch(e){}}
async function updatePost(id,st){try{await fetchAPI(`/api/admin/posts/${id}/status`,'PUT',{status:st});showT('已更新');loadPosts(pp);}catch(e){showT(e.message,'error');}}
async function deletePost(id){if(!confirm('确定删除？'))return;try{await fetchAPI(`/api/admin/posts/${id}`,'DELETE');showT('已删除');loadPosts(pp);}catch(e){showT(e.message,'error');}}
let up=1;async function loadUsers(page=1){up=page;const rl=document.getElementById('userFilter').value,sk=document.getElementById('userSearch').value;let url=`/api/admin/users?page=${page}&limit=15`;if(rl)url+=`&role=${rl}`;if(sk)url+=`&search=${encodeURIComponent(sk)}`;try{const d=await fetchAPI(url);document.getElementById('usersTable').innerHTML=`<table class="data-table"><thead><tr><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.nickname)}</td><td>${roleText(u.role)}</td><td><span class="status-${u.status}">${u.status==='active'?'正常':'封禁'}</span></td><td>${fmtDate(u.created_at)}</td><td class="flex gap-1">${u.id!==adminUser.id?`<button class="btn-outline" onclick="toggleUser('${u.id}','${u.status==='active'?'banned':'active'}')">${u.status==='active'?'封禁':'解封'}</button>${u.role!=='super_admin'?`<button class="btn-outline" onclick="changeRole('${u.id}','${u.role==='admin'?'user':'admin'}')">${u.role==='admin'?'取消管理':'设为管理'}</button><button class="btn-danger" onclick="deleteUser('${u.id}')">删除</button>`:''}`:'<span class="text-gray-300">-</span>'}</td></tr>`).join('')}</tbody></table>`;renderPag('usersPag',d.pagination,loadUsers);}catch(e){}}
async function toggleUser(id,st){try{await fetchAPI(`/api/admin/users/${id}/status`,'PUT',{status:st});showT(st==='banned'?'已封禁':'已解封');loadUsers(up);}catch(e){showT(e.message,'error');}}
async function changeRole(id,role){try{await fetchAPI(`/api/admin/users/${id}/role`,'PUT',{role});showT('已更新');loadUsers(up);}catch(e){showT(e.message,'error');}}
async function deleteUser(id){if(!confirm('确定删除？'))return;try{await fetchAPI(`/api/admin/users/${id}`,'DELETE');showT('已删除');loadUsers(up);}catch(e){showT(e.message,'error');}}
let cp=1;async function loadComments(page=1){cp=page;try{const d=await fetchAPI(`/api/admin/comments?page=${page}&limit=20`);document.getElementById('commentsTable').innerHTML=d.comments.length?`<table class="data-table"><thead><tr><th>内容</th><th>作者</th><th>帖子</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.comments.map(c=>`<tr><td class="max-w-[300px] truncate">${esc(c.content)}</td><td>${esc(c.author_name)}</td><td>${esc(c.post_title||'')}</td><td>${fmtDate(c.created_at)}</td><td><button class="btn-danger" onclick="deleteComment('${c.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-8">暂无</p>';renderPag('commentsPag',d.pagination,loadComments);}catch(e){}}

async function loadReports(){try{const d=await fetchAPI('/api/admin/reports');document.getElementById('reportsTable').innerHTML=d.reports.length?`<table class="data-table"><thead><tr><th>举报人</th><th>类型</th><th>原因</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.reports.map(r=>`<tr><td>${esc(r.reporter_name)}</td><td>${r.target_type}</td><td>${esc(r.reason)}</td><td>${fmtDate(r.created_at)}</td><td class="flex gap-1"><button class="btn-outline" onclick="resolve('${r.id}','resolved')">处理</button><button class="btn-outline" onclick="resolve('${r.id}','dismissed')">驳回</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-8">暂无</p>';}catch(e){}}

async function loadSettings(){try{const d=await fetchAPI('/api/admin/settings');const s=d.settings;document.getElementById('setSiteName').value=s.siteName||'';document.getElementById('setSiteDesc').value=s.siteDescription||'';document.getElementById('setAllowReg').checked=s.allowRegister==='true';document.getElementById('setAllowAnonymous').checked=s.allowAnonymous==='true';document.getElementById('setPostReview').checked=s.postReview==='true';document.getElementById('setMaxImg').value=s.maxImagesPerPost||9;}catch(e){}}
async function saveSettings(){try{await fetchAPI('/api/admin/settings','PUT',{siteName:document.getElementById('setSiteName').value,siteDescription:document.getElementById('setSiteDesc').value,allowRegister:String(document.getElementById('setAllowReg').checked),allowAnonymous:String(document.getElementById('setAllowAnonymous').checked),postReview:String(document.getElementById('setPostReview').checked),maxImagesPerPost:document.getElementById('setMaxImg').value});showT('已保存');}catch(e){showT(e.message,'error');}}

async function loadAdmins(){try{const d1=await fetchAPI('/api/admin/users?role=admin&limit=100');document.getElementById('adminsTable').innerHTML=d1.users.length?`<table class="data-table"><thead><tr><th>用户名</th><th>昵称</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${d1.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.nickname)}</td><td>${fmtDate(u.created_at)}</td><td><button class="btn-outline" onclick="changeRole('${u.id}','user')">取消管理</button> <button class="btn-danger" onclick="deleteUser('${u.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-8">暂无管理员</p>';}catch(e){}}

async function addAdmin(){const u=document.getElementById('newAdminUser').value,p=document.getElementById('newAdminPass').value,n=document.getElementById('newAdminNick').value;if(!u||!p||!n)return showT('请填写完整','error');try{await fetchAPI('/api/admin/users/admin','POST',{username:u,password:p,nickname:n});document.getElementById('addAdminModal').style.display='none';showT('已添加');loadAdmins();}catch(e){showT(e.message,'error');}}
async function fetchAPI(url,method='GET',body){const h={'Content-Type':'application/json'};if(token)h['Authorization']=`Bearer ${token}`;const o={method,headers:h};if(body)o.body=JSON.stringify(body);const r=await fetch(API+url,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'失败');return d;}
function renderPag(id,pag,fn){const c=document.getElementById(id);if(!pag||pag.totalPages<=1){c.innerHTML='';return;}let h='';if(pag.page>1)h+=`<button class="btn-outline" onclick="${fn.name}(${pag.page-1})">上页</button>`;for(let i=Math.max(1,pag.page-2);i<=Math.min(pag.totalPages,pag.page+2);i++)h+=`<button class="${i===pag.page?'btn-pink':'btn-outline'}" onclick="${fn.name}(${i})">${i}</button>`;if(pag.page<pag.totalPages)h+=`<button class="btn-outline" onclick="${fn.name}(${pag.page+1})">下页</button>`;c.innerHTML=h;}
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(s){if(!s)return '-';return new Date(s+(s.includes('Z')?'':'Z')).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function stText(s){return{published:'已发布',pending:'待审核',hidden:'已隐藏'}[s]||s;}
function roleText(r){return{user:'用户',admin:'管理员',super_admin:'超管'}[r]||r;}
function showT(m,t='success'){const c=document.getElementById('toast'),d=document.createElement('div');d.style.cssText=`background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);padding:10px 24px;border-radius:50px;box-shadow:0 5px 20px rgba(0,0,0,0.08);font-size:0.9rem;margin-bottom:10px;display:flex;align-items:center;animation:toastIn 0.3s;border:1px solid #ffe4e6;color:#333`;const icon=t==='success'?'<i class="fa-solid fa-circle-check" style="color:#10b981;margin-right:8px"></i>':'<i class="fa-solid fa-circle-exclamation" style="color:#f43f5e;margin-right:8px"></i>';d.innerHTML=icon+'<span>'+m+'</span>';c.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300);},3000);}

function showAddAnn(){document.getElementById('addAnnModal').style.display='flex';}
async function addAnn(){const title=document.getElementById('annTitle').value.trim(),content=document.getElementById('annContent').value.trim(),type=document.getElementById('annType').value,is_pinned=document.getElementById('annPin').checked;if(!title||!content)return showT('请填写标题和内容','error');try{await fetchAPI('/api/announcements','POST',{title,content,type,is_pinned});document.getElementById('addAnnModal').style.display='none';showT('公告已发布');document.getElementById('annTitle').value='';document.getElementById('annContent').value='';loadAnnouncements();}catch(e){showT(e.message,'error');}}
async function loadAnnouncements(){try{const d=await fetchAPI('/api/announcements/admin/all');document.getElementById('annTable').innerHTML=d.announcements.length?`<table class="data-table"><thead><tr><th>标题</th><th>类型</th><th>置顶</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.announcements.map(a=>`<tr><td class="max-w-[200px] truncate">${esc(a.title)}</td><td>${a.type==='urgent'?'🚨 紧急':a.type==='update'?'✨ 更新':'📢 普通'}</td><td>${a.is_pinned?'📌 是':'否'}</td><td>${fmtDate(a.created_at)}</td><td class="flex gap-1"><button class="btn-outline" onclick="togglePinAnn('${a.id}',${a.is_pinned?0:1})">${a.is_pinned?'取消置顶':'置顶'}</button><button class="btn-danger" onclick="deleteAnn('${a.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray-400 text-center py-8">暂无公告</p>';}catch(e){showT('加载失败','error');}}
async function togglePinAnn(id,pin){try{await fetchAPI(`/api/announcements/${id}`,'PUT',{is_pinned:pin});showT('已更新');loadAnnouncements();}catch(e){showT(e.message,'error');}}
async function deleteAnn(id){if(!confirm('确定删除此公告？'))return;try{await fetchAPI(`/api/announcements/${id}`,'DELETE');showT('已删除');loadAnnouncements();}catch(e){showT(e.message,'error');}}

function debounce(fn,d){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),d);};}
if(token)checkAuth();
