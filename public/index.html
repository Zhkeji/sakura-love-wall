<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌸 樱花表白墙</title>
<link rel="icon" href="/img/yingzhenyu.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#333;min-height:100vh}

/* 登录页 */
#authPage{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffdee9,#fad0c4,#a1c4fd,#b5fffc);background-size:400% 400%;animation:gm 8s ease infinite}
@keyframes gm{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#authPage.hidden{display:none}
.auth-box{background:rgba(255,255,255,0.25);backdrop-filter:blur(20px);border-radius:24px;padding:40px;width:380px;max-width:90vw;box-shadow:0 25px 50px rgba(0,0,0,0.15);border:1px solid rgba(255,255,255,0.3)}
.auth-box h2{text-align:center;font-size:26px;color:#fff;margin-bottom:6px}
.auth-box .sub{text-align:center;font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:28px}
.auth-box .field{margin-bottom:18px}
.auth-box .field input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.25);border-radius:14px;color:#fff;font-size:15px;outline:none}
.auth-box .field input::placeholder{color:rgba(255,255,255,0.5)}
.auth-box .field input:focus{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.3)}
.auth-box .btn{width:100%;padding:14px;background:linear-gradient(135deg,#e74c6f,#d63384);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.auth-box .links{display:flex;justify-content:space-between;margin-top:18px}
.auth-box .links a{color:rgba(255,255,255,0.7);font-size:13px;padding:6px 12px;border-radius:8px;text-decoration:none}
.auth-box .links a:hover{background:rgba(255,255,255,0.15);color:#fff}
#registerBox{display:none}

/* 主内容 */
#mainPage{display:none}
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-bottom:1px solid #eee}
.hdr-inner{max-width:1100px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;color:#e74c6f;text-decoration:none}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;background:none;color:#555}
.hdr-btn:hover{background:#fff0f3;color:#e74c6f}
.hdr-btn.pri{background:linear-gradient(135deg,#e74c6f,#d63384);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 280px;gap:20px}
.search-bar{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;border:1px solid #eee;display:flex;gap:8px}
.search-bar input{flex:1;border:none;outline:none;font-size:14px}
.search-bar button{background:#e74c6f;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs{display:flex;gap:4px;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:none;color:#888}
.tab.active{background:#e74c6f;color:#fff}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.04);border:1px solid #f5f0ee;cursor:pointer;transition:0.2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-2px)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.card-head .name{font-weight:600;font-size:14px}
.card-head .time{font-size:12px;color:#aaa}
.card-head .cat{font-size:11px;padding:3px 8px;border-radius:20px;background:#fff0f3;color:#e74c6f;margin-left:auto}
.card-title{font-size:16px;font-weight:600;margin-bottom:6px}
.card-text{font-size:14px;color:#555;line-height:1.6;margin-bottom:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card-tags span{font-size:11px;padding:2px 8px;background:#f8f0f2;color:#c4375a;border-radius:4px}
.card-foot{display:flex;align-items:center;gap:14px;padding-top:10px;border-top:1px solid #f5f0ee}
.act{display:flex;align-items:center;gap:4px;font-size:13px;color:#999;cursor:pointer;padding:4px 6px;border-radius:6px;border:none;background:none}
.act:hover{background:#fff0f3;color:#e74c6f}
.act.liked{color:#e74c6f}
.expand{color:#e74c6f;font-size:13px;cursor:pointer}
.sb-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid #f5f0ee}
.sb-card h3{font-size:14px;font-weight:600;margin-bottom:10px}
.sb-stats{display:flex;justify-content:space-around;text-align:center}
.sb-stats .num{font-size:22px;font-weight:700;color:#e74c6f}
.sb-stats .lbl{font-size:11px;color:#aaa}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px}
.tag-cloud span{font-size:11px;padding:3px 8px;background:#fff0f3;color:#e74c6f;border-radius:6px;cursor:pointer}
.sb-ann{padding:8px 0;border-bottom:1px solid #f5f0ee;font-size:13px}
.sb-ann:last-child{border-bottom:none}

/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.15);width:90%;max-width:460px;max-height:85vh;overflow-y:auto;padding:28px}
.modal-box.wide{max-width:620px}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#f0f0f0;border-radius:50%;cursor:pointer;font-size:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:5px}
.fi{width:100%;padding:10px 14px;border:1px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none;background:#fafafa}
.fi:focus{border-color:#e74c6f;box-shadow:0 0 0 3px rgba(231,76,111,0.08)}
textarea.fi{min-height:90px;resize:vertical;font-family:inherit}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#e74c6f,#d63384);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer}

/* 详情 */
.dtl-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dtl-head img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.dtl-title{font-size:20px;font-weight:700;margin-bottom:10px}
.dtl-content{font-size:15px;color:#333;line-height:1.8;margin-bottom:14px;white-space:pre-wrap}
.dtl-actions{display:flex;gap:10px;padding:10px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;margin-bottom:14px}
.cmt{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #f5f0ee}
.cmt img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.cmt-name{font-weight:600;font-size:13px}
.cmt-text{font-size:13px;color:#444;margin-top:2px}
.cmt-time{font-size:11px;color:#bbb;margin-top:3px}

/* Toast */
#toastArea{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none}
.toast{background:rgba(255,255,255,0.95);padding:10px 20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.1);font-size:13px;margin-bottom:6px;animation:fadeUp 0.3s}
.toast.ok{border-left:3px solid #27ae60}
.toast.err{border-left:3px solid #e74c3c}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* 移动端 */
.m-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-top:1px solid #eee;z-index:100;justify-content:space-around;padding:6px 0}
.m-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#999;background:none;border:none;cursor:pointer;padding:4px 10px}
.m-item i{font-size:18px}
@media(max-width:768px){.wrap{grid-template-columns:1fr;padding:12px}.sidebar{display:none}.m-nav{display:flex}body{padding-bottom:54px}.hdr-inner{padding:0 12px}}
</style>
</head>
<body>

<div id="toastArea"></div>

<!-- 登录页 -->
<div id="authPage">
  <div class="auth-box" id="loginBox">
    <h2>🌸 欢迎回来</h2>
    <p class="sub">登录你的樱花表白墙账号</p>
    <div class="field"><input type="text" id="loginUser" placeholder="用户名"></div>
    <div class="field"><input type="password" id="loginPass" placeholder="密码"></div>
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="links"><a href="#" onclick="showReg();return false">注册账号</a></div>
  </div>
  <div class="auth-box" id="registerBox">
    <h2>✨ 加入我们</h2>
    <p class="sub">创建你的樱花表白墙账号</p>
    <div class="field"><input type="text" id="regUser" placeholder="用户名 (3-20字符)"></div>
    <div class="field"><input type="text" id="regNick" placeholder="昵称"></div>
    <div class="field"><input type="password" id="regPass" placeholder="密码 (至少6位)"></div>
    <div class="field"><input type="password" id="regConfirm" placeholder="确认密码"></div>
    <button class="btn" onclick="doRegister()">注 册</button>
    <div class="links"><a href="#" onclick="showLogin();return false">已有账号？去登录</a></div>
  </div>
</div>

<!-- 主内容 -->
<div id="mainPage">
  <header class="header">
    <div class="hdr-inner">
      <a href="/" class="logo">🌸 樱花表白墙</a>
      <div class="hdr-right">
        <button class="hdr-btn" onclick="location.href='/chat'"><i class="fa-solid fa-envelope"></i></button>
        <button class="hdr-btn pri" onclick="openModal('postModal')"><i class="fa-solid fa-pen"></i> 写表白</button>
        <button class="hdr-btn" onclick="openProfile()"><i class="fa-solid fa-user"></i></button>
        <button class="hdr-btn" onclick="doLogout()" style="color:#e74c3c"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="feed">
      <div class="search-bar">
        <input id="searchInput" placeholder="搜索表白内容..." onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()"><i class="fa-solid fa-search"></i></button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="setSort('latest',this)">🕐 最新</button>
        <button class="tab" onclick="setSort('hot',this)">🔥 最热</button>
        <button class="tab" onclick="setSort('views',this)">👁 浏览</button>
        <button class="tab" onclick="setSort('comments',this)">💬 评论</button>
      </div>
      <div id="postsArea"></div>
      <div id="loading" style="text-align:center;padding:30px;color:#ccc"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <div id="empty" style="display:none;text-align:center;padding:50px;color:#aaa"><div style="font-size:40px;margin-bottom:10px">💭</div><p>还没有表白</p></div>
      <div id="pagination" style="display:flex;justify-content:center;gap:6px;margin-top:16px"></div>
    </div>
    <div class="sidebar">
      <div class="sb-card">
        <h3><i class="fa-solid fa-chart-pie"></i> 数据</h3>
        <div class="sb-stats">
          <div><div class="num" id="sPosts">0</div><div class="lbl">表白</div></div>
          <div><div class="num" id="sUsers">0</div><div class="lbl">用户</div></div>
        </div>
      </div>
      <div class="sb-card">
        <h3><i class="fa-solid fa-bullhorn"></i> 公告</h3>
        <div id="sbAnn"><p style="color:#aaa;font-size:12px">暂无公告</p></div>
      </div>
      <div class="sb-card">
        <h3><i class="fa-solid fa-tags"></i> 热门标签</h3>
        <div class="tag-cloud" id="tagCloud"><p style="color:#aaa;font-size:12px">暂无标签</p></div>
      </div>
    </div>
  </div>

  <nav class="m-nav">
    <button class="m-item"><i class="fa-solid fa-home"></i>首页</button>
    <button class="m-item" onclick="openModal('postModal')"><i class="fa-solid fa-pen"></i>发布</button>
    <button class="m-item" onclick="location.href='/chat'"><i class="fa-solid fa-envelope"></i>私信</button>
    <button class="m-item" onclick="openProfile()"><i class="fa-solid fa-user"></i>我的</button>
  </nav>
</div>

<!-- 发帖弹窗 -->
<div class="modal" id="postModal" onclick="closeModal('postModal')">
  <div class="modal-box wide" onclick="event.stopPropagation()" style="position:relative">
    <button class="modal-close" onclick="closeModal('postModal')">&times;</button>
    <h2 style="font-size:18px;margin-bottom:16px">💌 写一封表白</h2>
    <div class="fg"><label>标题</label><input class="fi" id="pTitle" maxlength="100" placeholder="标题"></div>
    <div class="fg"><label>内容</label><textarea class="fi" id="pContent" maxlength="5000" placeholder="写下你想说的话..."></textarea></div>
    <div class="fg"><label>标签 (逗号分隔)</label><input class="fi" id="pTags" placeholder="如: 暗恋,校园"></div>
    <div style="display:flex;gap:14px;margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:6px;font-size:14px"><input type="checkbox" id="pAnon">匿名</label>
      <select class="fi" id="pCat" style="width:auto;padding:6px 10px"><option value="confession">💕 表白</option><option value="daily">☕ 日常</option><option value="expand">🤝 扩列</option></select>
    </div>
    <button class="btn" onclick="doPost()">发布</button>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal" onclick="closeModal('detailModal')">
  <div class="modal-box wide" onclick="event.stopPropagation()" style="position:relative;max-height:85vh;overflow-y:auto">
    <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    <div id="detailArea"></div>
  </div>
</div>

<!-- 个人资料弹窗 -->
<div class="modal" id="profileModal" onclick="closeModal('profileModal')">
  <div class="modal-box" onclick="event.stopPropagation()" style="position:relative">
    <button class="modal-close" onclick="closeModal('profileModal')">&times;</button>
    <div style="text-align:center;margin-bottom:16px">
      <img id="pAvatar" src="/img/loge.png" style="width:72px;height:72px;border-radius:50%;object-fit:cover">
      <h3 id="pName" style="font-size:17px;margin-top:8px">-</h3>
    </div>
    <div class="fg"><label>昵称</label><input class="fi" id="eNick"></div>
    <div class="fg"><label>简介</label><textarea class="fi" id="eBio" rows="2"></textarea></div>
    <button class="btn" onclick="doSaveProfile()" style="margin-bottom:14px">保存资料</button>
    <div style="border-top:1px solid #eee;padding-top:14px">
      <p style="font-weight:600;font-size:14px;margin-bottom:8px">修改密码</p>
      <div class="fg"><input class="fi" type="password" id="eOldPwd" placeholder="旧密码"></div>
      <div class="fg"><input class="fi" type="password" id="eNewPwd" placeholder="新密码"></div>
      <button onclick="doChangePwd()" style="width:100%;padding:10px;border-radius:10px;border:1px solid #eee;background:#fff;cursor:pointer">修改密码</button>
    </div>
    <button onclick="doLogout()" style="width:100%;padding:10px;border-radius:10px;border:1px solid #fde8e8;background:#fff5f5;color:#e74c3c;cursor:pointer;margin-top:10px">退出登录</button>
  </div>
</div>

<script>
// ========================
// 全局变量 - 不用IIFE
// ========================
var TOKEN = localStorage.getItem('token') || null;
var USER = null;
var PAGE = 1;
var SORT = 'latest';
var SEARCH = '';
var HASMORE = true;
var LOADING = false;

// ========================
// 工具函数
// ========================
function $(id) { return document.getElementById(id); }

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, ok) {
  var c = $('toastArea');
  var t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function timeAgo(s) {
  var d = new Date(s + (s.indexOf('Z') >= 0 ? '' : 'Z'));
  var diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
  return Math.floor(diff / 2592000) + '个月前';
}

function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

// ========================
// API 请求
// ========================
function api(method, path, data, callback) {
  var r = new XMLHttpRequest();
  r.open(method, path, true);
  r.setRequestHeader('Content-Type', 'application/json');
  if (TOKEN) r.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
  r.onreadystatechange = function() {
    if (r.readyState === 4) {
      try {
        var d = JSON.parse(r.responseText);
        if (r.status >= 200 && r.status < 300) callback(null, d);
        else callback(d.error || '请求失败');
      } catch (e) { callback('解析失败'); }
    }
  };
  r.onerror = function() { callback('网络错误'); };
  r.send(data ? JSON.stringify(data) : null);
}

// ========================
// 登录注册
// ========================
function showReg() {
  $('loginBox').style.display = 'none';
  $('registerBox').style.display = 'block';
}

function showLogin() {
  $('registerBox').style.display = 'none';
  $('loginBox').style.display = 'block';
}

function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if (!u || !p) { alert('请输入账号和密码'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/auth/login', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && d.token) {
          TOKEN = d.token;
          USER = d.user;
          localStorage.setItem('token', TOKEN);
          enterSite();
        } else {
          alert('登录失败: ' + (d.error || '未知错误'));
        }
      } catch(e) { alert('错误: ' + e.message); }
    }
  };
  xhr.onerror = function() { alert('网络错误'); };
  xhr.send(JSON.stringify({ username: u, password: p }));
}

function doRegister() {
  var u = document.getElementById('regUser').value.trim();
  var n = document.getElementById('regNick').value.trim();
  var p = document.getElementById('regPass').value;
  var c = document.getElementById('regConfirm').value;
  if (!u || !n || !p) { alert('请填写完整'); return; }
  if (p.length < 6) { alert('密码至少6位'); return; }
  if (p !== c) { alert('两次密码不一致'); return; }
  var body = { username: u, password: p, nickname: n };
  
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/auth/register', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && d.token) {
          TOKEN = d.token;
          USER = d.user;
          localStorage.setItem('token', TOKEN);
          enterSite();
        } else {
          alert('注册失败: ' + (d.error || '未知错误'));
        }
      } catch(e) { alert('错误: ' + e.message); }
    }
  };
  xhr.onerror = function() { alert('网络错误'); };
  xhr.send(JSON.stringify(body));
}

function doLogout() {
  TOKEN = null;
  USER = null;
  localStorage.removeItem('token');
  location.reload();
}

function enterSite() {
  $('authPage').classList.add('hidden');
  $('mainPage').style.display = 'block';
  loadPosts(true);
  loadSidebar();
}

// ========================
// 帖子
// ========================
function loadPosts(reset) {
  if (LOADING) return;
  if (reset) { PAGE = 1; HASMORE = true; $('postsArea').innerHTML = ''; }
  if (!HASMORE) return;
  LOADING = true;
  $('loading').style.display = 'block';
  $('empty').style.display = 'none';

  var url = '/api/posts?page=' + PAGE + '&sort=' + SORT;
  if (SEARCH) url += '&search=' + encodeURIComponent(SEARCH);

  api('GET', url, null, function(err, d) {
    LOADING = false;
    $('loading').style.display = 'none';
    if (err) { toast('加载失败'); return; }

    var area = $('postsArea');
    for (var i = 0; i < d.posts.length; i++) {
      area.appendChild(makeCard(d.posts[i]));
    }
    HASMORE = PAGE < d.pagination.totalPages;
    PAGE++;
    if (d.posts.length === 0 && PAGE === 2) $('empty').style.display = 'block';
    renderPag(d.pagination);
  });
}

function makeCard(p) {
  var div = document.createElement('div');
  div.className = 'card';

  var catIcons = { confession: '💕', daily: '☕', expand: '🤝' };
  var catNames = { confession: '表白', daily: '日常', expand: '扩列' };
  var catHtml = p.category ? '<span class="cat">' + (catIcons[p.category] || '💕') + ' ' + (catNames[p.category] || '表白') + '</span>' : '';

  var tags = p.tags || [];
  var tagsHtml = '';
  if (tags.length) {
    tagsHtml = '<div class="card-tags">';
    for (var i = 0; i < tags.length; i++) tagsHtml += '<span>#' + esc(tags[i]) + '</span>';
    tagsHtml += '</div>';
  }

  var pinned = p.is_pinned ? '<div style="font-size:11px;color:#e74c6f;margin-bottom:6px"><i class="fa-solid fa-thumbtack"></i> 置顶</div>' : '';
  var author = p.is_anonymous ? '匿名用户' : (p.author_name || '用户');
  var avatar = p.is_anonymous ? '/img/loge.png' : (p.author_avatar || '/img/loge.png');

  var content = p.content || '';
  var isLong = content.length > 150;
  var shortText = isLong ? content.substring(0, 150) + '...' : content;
  var expandHtml = isLong ? ' <span class="expand" onclick="event.stopPropagation();expandPost(this,\'' + p.id + '\')">展开全文</span>' : '';

  var msgBtn = '';
  if (p.author_id && USER && p.author_id !== USER.id) {
    msgBtn = '<button class="act" onclick="event.stopPropagation();startChat(\'' + p.author_id + '\')"><i class="fa-regular fa-envelope"></i></button>';
  }

  div.innerHTML = pinned +
    '<div class="card-head"><img src="' + avatar + '"><div><div class="name">' + esc(author) + '</div><div class="time">' + timeAgo(p.created_at) + '</div></div>' + catHtml + '</div>' +
    '<div class="card-title">' + esc(p.title) + '</div>' +
    tagsHtml +
    '<div class="card-text" id="ct-' + p.id + '">' + esc(shortText) + expandHtml + '</div>' +
    '<div class="card-foot">' +
    '<button class="act ' + (p.isLiked ? 'liked' : '') + '" onclick="event.stopPropagation();likePost(\'' + p.id + '\',this)"><i class="fa-' + (p.isLiked ? 'solid' : 'regular') + ' fa-heart"></i> ' + p.likes + '</button>' +
    '<button class="act" onclick="event.stopPropagation();openDetail(\'' + p.id + '\')"><i class="fa-regular fa-comment-dots"></i> ' + p.comments_count + '</button>' +
    '<span class="act" style="cursor:default"><i class="fa-regular fa-eye"></i> ' + (p.views || 0) + '</span>' +
    '<button class="act ' + (p.isBookmarked ? 'liked' : '') + '" onclick="event.stopPropagation();toggleBookmark(\'' + p.id + '\',this)"><i class="fa-' + (p.isBookmarked ? 'solid' : 'regular') + ' fa-bookmark"></i></button>' +
    msgBtn +
    '</div>';

  div.onclick = function() { openDetail(p.id); };
  return div;
}

function expandPost(el, id) {
  api('GET', '/api/posts/' + id, null, function(err, d) {
    if (err) return;
    var area = $('ct-' + id);
    if (area) area.innerHTML = esc(d.post.content) + ' <span class="expand" onclick="event.stopPropagation();location.reload()">收起</span>';
  });
}

function setSort(sort, btn) {
  SORT = sort;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  btn.classList.add('active');
  loadPosts(true);
}

function doSearch() {
  SEARCH = $('searchInput').value.trim();
  loadPosts(true);
}

// ========================
// 分页
// ========================
function renderPag(pag) {
  var c = $('pagination');
  if (!pag || pag.totalPages <= 1) { c.innerHTML = ''; return; }
  var h = '';
  if (pag.page > 1) h += '<button onclick="goPage(' + (pag.page - 1) + ')" style="padding:7px 14px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer">上页</button>';
  for (var i = Math.max(1, pag.page - 2); i <= Math.min(pag.totalPages, pag.page + 2); i++) {
    var active = i === pag.page;
    h += '<button onclick="goPage(' + i + ')" style="padding:7px 14px;border:1px solid ' + (active ? '#e74c6f' : '#e0e0e0') + ';border-radius:8px;background:' + (active ? '#e74c6f' : '#fff') + ';color:' + (active ? '#fff' : '#333') + ';cursor:pointer">' + i + '</button>';
  }
  if (pag.page < pag.totalPages) h += '<button onclick="goPage(' + (pag.page + 1) + ')" style="padding:7px 14px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer">下页</button>';
  c.innerHTML = h;
}

function goPage(p) { PAGE = p; loadPosts(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ========================
// 详情
// ========================
function openDetail(id) {
  api('GET', '/api/posts/' + id, null, function(err, d) {
    if (err) { toast('加载失败'); return; }
    var p = d.post, comments = d.comments;
    var author = p.is_anonymous ? '匿名用户' : (p.author_name || '用户');
    var avatar = p.is_anonymous ? '/img/loge.png' : (p.author_avatar || '/img/loge.png');
    var tags = p.tags || [];
    var tagsHtml = '';
    if (tags.length) { tagsHtml = '<div class="card-tags">'; for (var i = 0; i < tags.length; i++) tagsHtml += '<span>#' + esc(tags[i]) + '</span>'; tagsHtml += '</div>'; }

    var chatBtn = '';
    if (p.author_id && USER && p.author_id !== USER.id) {
      chatBtn = '<button class="act" onclick="startChat(\'' + p.author_id + '\')"><i class="fa-solid fa-envelope"></i> 私信</button>';
    }

    var cmtsHtml = '';
    for (var i = 0; i < comments.length; i++) {
      var c = comments[i];
      cmtsHtml += '<div class="cmt"><img src="' + (c.author_avatar || '/img/loge.png') + '"><div><div class="cmt-name">' + esc(c.author_name) + '</div><div class="cmt-text">' + esc(c.content) + '</div><div class="cmt-time">' + timeAgo(c.created_at) + '</div></div></div>';
    }
    if (!comments.length) cmtsHtml = '<p style="color:#aaa;text-align:center;padding:16px">暂无评论</p>';

    $('detailArea').innerHTML =
      '<div class="dtl-head"><img src="' + avatar + '"><div><div style="font-weight:600">' + esc(author) + '</div><div style="font-size:12px;color:#aaa">' + timeAgo(p.created_at) + '</div></div></div>' +
      '<div class="dtl-title">' + esc(p.title) + '</div>' + tagsHtml +
      '<div class="dtl-content">' + esc(p.content) + '</div>' +
      '<div class="dtl-actions">' +
      '<button class="act ' + (p.isLiked ? 'liked' : '') + '" onclick="likePost(\'' + p.id + '\',this)"><i class="fa-' + (p.isLiked ? 'solid' : 'regular') + ' fa-heart"></i> ' + p.likes + '</button>' +
      '<span class="act"><i class="fa-regular fa-comment-dots"></i> ' + p.comments_count + '</span>' +
      chatBtn +
      '</div>' +
      '<h4 style="font-size:15px;margin:14px 0 10px">评论 (' + comments.length + ')</h4>' +
      cmtsHtml +
      '<div style="display:flex;gap:8px;margin-top:14px"><input class="fi" id="cmtInput" placeholder="写下评论..." style="flex:1"><button class="btn" style="padding:8px 16px;font-size:13px;width:auto" onclick="submitComment(\'' + p.id + '\')">发送</button></div>';

    openModal('detailModal');
  });
}

function submitComment(postId) {
  var input = $('cmtInput');
  var content = input.value.trim();
  if (!content) return;
  api('POST', '/api/posts/' + postId + '/comments', { content: content }, function(err) {
    if (err) { toast(err); return; }
    toast('评论成功 ✨', true);
    input.value = '';
    openDetail(postId);
  });
}

// ========================
// 点赞/收藏/发帖/私信/资料
// ========================
function likePost(id, btn) {
  if (btn.dataset.busy) return;
  btn.dataset.busy = '1';
  api('POST', '/api/posts/' + id + '/like', {}, function(err, d) {
    delete btn.dataset.busy;
    if (err) return;
    btn.classList.toggle('liked', d.liked);
    btn.innerHTML = '<i class="fa-' + (d.liked ? 'solid' : 'regular') + ' fa-heart"></i> ' + d.likes;
  });
}

function toggleBookmark(id, btn) {
  var isBk = btn.classList.contains('liked');
  api(isBk ? 'DELETE' : 'POST', '/api/bookmarks/' + id, {}, function(err) {
    if (err) { toast(err); return; }
    btn.classList.toggle('liked');
    btn.innerHTML = '<i class="fa-' + (btn.classList.contains('liked') ? 'solid' : 'regular') + ' fa-bookmark"></i>';
    toast(btn.classList.contains('liked') ? '收藏成功 🔖' : '已取消', true);
  });
}

function doPost() {
  var title = $('pTitle').value.trim();
  var content = $('pContent').value.trim();
  var tagsStr = $('pTags').value.trim();
  if (!title || !content) { toast('请输入标题和内容'); return; }
  var tags = tagsStr ? tagsStr.split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
  api('POST', '/api/posts', { title: title, content: content, isAnonymous: $('pAnon').checked, tags: tags, category: $('pCat').value }, function(err) {
    if (err) { toast(err); return; }
    closeModal('postModal');
    toast('发布成功 🌸', true);
    $('pTitle').value = ''; $('pContent').value = ''; $('pTags').value = '';
    loadPosts(true);
  });
}

function startChat(userId) {
  api('POST', '/api/chat/conversations', { userId: userId }, function(err, d) {
    if (err) { toast('无法发起私信'); return; }
    location.href = '/chat?id=' + d.conversation.id;
  });
}

function openProfile() {
  if (!USER) return;
  $('pAvatar').src = USER.avatar || '/img/loge.png';
  $('pName').textContent = USER.nickname;
  $('eNick').value = USER.nickname || '';
  $('eBio').value = USER.bio || '';
  openModal('profileModal');
}

function doSaveProfile() {
  var nick = $('eNick').value.trim();
  var bio = $('eBio').value.trim();
  if (!nick) { toast('昵称不能为空'); return; }
  api('PUT', '/api/auth/profile', { nickname: nick, bio: bio }, function(err, d) {
    if (err) { toast(err); return; }
    USER = d.user;
    toast('已保存', true);
  });
}

function doChangePwd() {
  var old = $('eOldPwd').value;
  var nw = $('eNewPwd').value;
  if (!old || !nw) { toast('请输入密码'); return; }
  if (nw.length < 6) { toast('新密码至少6位'); return; }
  api('PUT', '/api/auth/password', { oldPassword: old, newPassword: nw }, function(err) {
    if (err) { toast(err); return; }
    toast('密码已修改', true);
    $('eOldPwd').value = ''; $('eNewPwd').value = '';
  });
}

// ========================
// 侧边栏
// ========================
function loadSidebar() {
  api('GET', '/api/posts?limit=1', null, function(err, d) {
    if (!err) $('sPosts').textContent = d.pagination.total;
  });

  api('GET', '/api/posts/meta/tags', null, function(err, d) {
    if (err || !d.tags.length) return;
    var html = '';
    for (var i = 0; i < d.tags.length; i++) {
      var t = d.tags[i];
      html += '<span onclick="$(\'searchInput\').value=\'' + esc(t.name) + '\';SEARCH=\'' + esc(t.name) + '\';loadPosts(true)">#' + esc(t.name) + ' (' + t.count + ')</span>';
    }
    $('tagCloud').innerHTML = html;
  });

  api('GET', '/api/announcements?limit=5', null, function(err, d) {
    if (err || !d.announcements.length) return;
    var icons = { info: '📢', urgent: '🚨', update: '✨' };
    var html = '';
    for (var i = 0; i < d.announcements.length; i++) {
      var a = d.announcements[i];
      html += '<div class="sb-ann"><b>' + (icons[a.type] || '📢') + ' ' + esc(a.title) + '</b><div style="font-size:12px;color:#aaa;margin-top:2px">' + esc(a.content).substring(0, 60) + '</div></div>';
    }
    $('sbAnn').innerHTML = html;
  });
}

// ========================
// 初始化
// ========================
if (TOKEN) {
  api('GET', '/api/auth/me', null, function(err, d) {
    if (err || !d.user) {
      localStorage.removeItem('token');
      TOKEN = null;
      return;
    }
    USER = d.user;
    enterSite();
  });
}
</script>
</body>
</html>
